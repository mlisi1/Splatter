services:
  splatter:
    build: .
    image: splatter:latest
    ipc: host
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./pipeline.py:/workspace/pipeline.py
      - ./splatter:/workspace/splatter
      - ./entry_script.sh:/usr/local/bin/entry_script.sh
      - ./data/input:/data/input:ro      # put videos, PLY files, extrinsics here
      - ./data/output:/data/output       # pipeline writes here
      - model_cache:/cache/.cache        # DAv2 + hloc (torch.hub) + HF sky-mask weights survive restarts

volumes:
  model_cache:
